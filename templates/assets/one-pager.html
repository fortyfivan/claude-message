<!-- template: one-pager | version: 1.0 | updated: 2026-03-13 -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{headline}}</title>
  <style>
    :root {
      --color-primary: {{colors.primary}};
      --color-secondary: {{colors.secondary}};
      --color-accent: {{colors.accent}};
      --color-text: {{colors.text}};
      --color-text-light: {{colors.text-light}};
      --color-background: {{colors.background}};
      --font-heading: {{typography.heading}};
      --font-body: {{typography.body}};
    }

    @page {
      size: letter;
      margin: 0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body, 'Inter', 'Helvetica Neue', Arial, sans-serif);
      color: var(--color-text, #1a1a2e);
      background: var(--color-background, #ffffff);
      line-height: 1.5;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .page {
      width: 8.5in;
      min-height: 11in;
      margin: 0 auto;
      padding: 0.6in 0.75in;
      display: flex;
      flex-direction: column;
    }

    /* ── Zone: Header ── */
    .zone-header {
      text-align: center;
      padding-bottom: 0.4in;
      margin-bottom: 0.35in;
      border-bottom: 3px solid var(--color-primary, #2563eb);
    }

    .zone-header .logo {
      height: 32px;
      width: auto;
      margin-bottom: 16px;
    }

    .zone-header h1 {
      font-family: var(--font-heading, 'Inter', 'Helvetica Neue', Arial, sans-serif);
      font-size: 26px;
      font-weight: 700;
      color: var(--color-primary, #2563eb);
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .zone-header .subheadline {
      font-size: 15px;
      color: var(--color-text-light, #64748b);
      line-height: 1.5;
    }

    /* ── Zone: Challenge ── */
    .zone-challenge {
      margin-bottom: 0.35in;
    }

    .zone-challenge h2 {
      font-family: var(--font-heading, 'Inter', 'Helvetica Neue', Arial, sans-serif);
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-accent, #7c3aed);
      margin-bottom: 8px;
    }

    .zone-challenge p {
      font-size: 14px;
      line-height: 1.65;
    }

    /* ── Zone: Solution ── */
    .zone-solution {
      margin-bottom: 0.35in;
      padding: 20px 24px;
      background: #f8f9fb;
      border-radius: 6px;
      border-left: 4px solid var(--color-primary, #2563eb);
    }

    .zone-solution h2 {
      font-family: var(--font-heading, 'Inter', 'Helvetica Neue', Arial, sans-serif);
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-accent, #7c3aed);
      margin-bottom: 8px;
    }

    .zone-solution p {
      font-size: 14px;
      line-height: 1.65;
    }

    /* ── Zone: Benefits ── */
    .zone-benefits {
      margin-bottom: 0.35in;
      flex: 1;
    }

    .zone-benefits h2 {
      font-family: var(--font-heading, 'Inter', 'Helvetica Neue', Arial, sans-serif);
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-accent, #7c3aed);
      margin-bottom: 12px;
    }

    .benefits-list {
      list-style: none;
    }

    .benefits-list li {
      padding: 10px 0;
      border-bottom: 1px solid #e2e8f0;
      font-size: 14px;
      line-height: 1.5;
    }

    .benefits-list li:last-child {
      border-bottom: none;
    }

    .benefits-list li strong {
      color: var(--color-primary, #2563eb);
    }

    /* ── Zone: Proof ── */
    .zone-proof {
      margin-bottom: 0.3in;
      padding: 18px 22px;
      background: linear-gradient(135deg, var(--color-primary, #2563eb), var(--color-secondary, #1e40af));
      border-radius: 6px;
      color: #ffffff;
    }

    .zone-proof blockquote {
      font-size: 15px;
      font-style: italic;
      line-height: 1.55;
      margin-bottom: 8px;
    }

    .zone-proof .attribution {
      font-size: 12px;
      opacity: 0.85;
    }

    .zone-proof .metric {
      display: inline-block;
      margin-top: 10px;
      font-size: 22px;
      font-weight: 700;
      font-family: var(--font-heading, 'Inter', 'Helvetica Neue', Arial, sans-serif);
    }

    /* ── Zone: CTA ── */
    .zone-cta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.2in;
      border-top: 1px solid #e2e8f0;
      margin-top: auto;
    }

    .zone-cta .cta-button {
      display: inline-block;
      padding: 10px 28px;
      background: var(--color-primary, #2563eb);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 4px;
    }

    .zone-cta .cta-supporting {
      font-size: 12px;
      color: var(--color-text-light, #64748b);
    }

    @media print {
      body { background: white; }
      .page {
        width: 100%;
        min-height: 100vh;
        padding: 0.6in 0.75in;
        page-break-after: always;
      }
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="zone-header">
      <img src="{{logo.primary}}" alt="Logo" class="logo" /><br/>
      <h1>{{headline}}</h1>
      <p class="subheadline">{{subheadline}}</p>
    </div>

    <div class="zone-challenge">
      <h2>The Challenge</h2>
      <p>{{challenge}}</p>
    </div>

    <div class="zone-solution">
      <h2>The Solution</h2>
      <p>{{solution}}</p>
    </div>

    <div class="zone-benefits">
      <h2>Key Benefits</h2>
      <ul class="benefits-list">
        {{#key_benefits}}
        <li><strong>{{name}}:</strong> {{description}}</li>
        {{/key_benefits}}
      </ul>
    </div>

    <div class="zone-proof">
      <blockquote>"{{proof.quote}}"</blockquote>
      <div class="attribution">{{proof.attribution}}</div>
      <div class="metric">{{proof.metric}}</div>
    </div>

    <div class="zone-cta">
      <a href="{{cta.url}}" class="cta-button">{{cta.action}}</a>
      <span class="cta-supporting">{{cta.supporting}}</span>
    </div>

  </div>
</body>
</html>
