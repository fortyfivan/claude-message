name: validate

on:
  pull_request:
    paths:
      - "MESSAGE.md"
      - "CLAUDE.md"
      - "messaging/**"
      - ".claude/**"
      - "scripts/validate.py"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run structural validation
        run: python scripts/validate.py
